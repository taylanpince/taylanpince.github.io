<a class="book-card" href="{{ .RelPermalink }}">
  <span class="book-card-cover">{{ partial "film_cover.html" (dict "page" . "width" 220) }}</span>
  <span class="book-card-title">{{ .Title }}</span>
  {{- with .Params.filmDirector }}<span class="book-card-author">{{ . }}</span>{{ end }}
  {{ partial "book_rating.html" .Params.filmRating }}
</a>
